version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudops-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudops_db
      POSTGRES_USER: cloudops
      POSTGRES_PASSWORD: cloudops_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudops -d cloudops_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
